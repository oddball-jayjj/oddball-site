<style>
:root{--bg:#F6F3EE;--surface:#fff;--ink:#1C1915;--muted:#6F675E;--line:#E3DDD3;--soft:#F0EBE3;--crust:#7A4A2B;--warn:#B4531A;--ok:#2C7A4B;

*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;word-break:keep-all}
a{color:inherit}
.bar{position:sticky;top:0;z-index:5;background:rgba(246,243,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.lead{color:var(--muted);margin:0 0 20px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);padding:20px;margin-bottom:16px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}

.btn.p{background:var(--ink);color:var(--bg)}
.btn.s{padding:5px 9px;font-size:13px;font-weight:500;border-color:var(--line)}
.btn.x{border-color:transparent;color:var(--warn)}
input,select,textarea{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 9px;border-radius:2px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.list{display:grid;border:1px solid var(--line);background:#fff;max-height:560px;overflow:auto}
.list button{border:0;border-bottom:1px solid var(--line);background:none;font:inherit;text-align:left;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.list button[aria-selected=true]{background:var(--soft);font-weight:700}
.list small{color:var(--muted);font-weight:400}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;border:1px solid var(--ink)}
.kpi div{padding:12px 14px;border-right:1px solid var(--line)}
.kpi div:last-child{border-right:0}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.note{font-size:13px;color:var(--muted)}

.bar-w{height:6px;background:var(--soft);min-width:60px}.bar-w i{display:block;height:100%;background:var(--crust)}
.nut10{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media(max-width:600px){.nut10{grid-template-columns:repeat(2,1fr)}}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);padding:1px 6px;color:var(--muted)}
/* 라벨 */
.lbl{width:100mm;min-height:80mm;border:1px solid #000;background:#fff;color:#000;font-size:8.5pt;line-height:1.3;padding:1.5mm}
.lbl h3{font-size:10pt;text-align:center;margin:0 0 1mm}
.lbl table{border:1px solid #000}

.doc{background:#fff;color:#000;border:1px solid var(--line);padding:28px;max-width:820px}
.doc h3{text-align:center;font-size:24px;letter-spacing:.4em;margin:0 0 18px}
.doc table td,.doc table th{border:1px solid #999;padding:6px 8px;color:#000}
.doc th{background:#f2f2f2}
.guide{background:var(--surface);border:1px solid var(--ink);margin-bottom:16px}

.guide summary::-webkit-details-marker{display:none}
.guide summary span{font-weight:400;font-size:13px;color:var(--muted)}
.guide ol{margin:0;padding:4px 16px 16px 16px;list-style:none;counter-reset:g;display:grid;gap:10px;border-top:1px solid var(--line)}
.guide li{counter-increment:g;display:grid;grid-template-columns:28px 1fr;column-gap:10px;padding-top:10px}
.guide li::before{content:counter(g);grid-row:span 2;width:24px;height:24px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:14px}
.guide li b{font-size:14px}.guide li span{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font-size:14px;z-index:20}
@media print{body{background:#fff}.bar,.noprint,.lead,.eyebrow,h1{display:none!important}main{padding:0}.panel{border:0;padding:0;margin:0}.printarea{display:block!important}.doc{border:0;max-width:none}
 body.p-label .lbl{page-break-after:always;margin:0 auto}}

<script>
"use strict";
/* ===== 저장 (이 컴퓨터 브라우저에만) ===== */
const KEY="oddball-tools-v1";
const blank=()=>({materials:[],recipes:[],quotes:[],company:{name:"",ceo:"",bizno:"",address:"",tel:"",foodType:"기타가공품(가열하여 섭취하는 식품)",storage:"-18도 이하 냉동보관(해동후 재냉동금지)",shelf:"제조일로부터 270일"},v:1});
let D;
try{D=JSON.parse(localStorage.getItem(KEY))||blank();}catch(e){D=blank();}
D=Object.assign(blank(),D);D.company=Object.assign(blank().company,D.company);
let saveT;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){toast("저장 공간이 부족해요. 백업 파일로 받아 두세요.");}},250);};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,""));return isFinite(n)?n:0;};
const won=v=>Math.round(v).toLocaleString("ko-KR");
const r1=v=>Math.round(v*10)/10;
const fmt=(v,d=1)=>{const m=10**d;return (Math.round(v*m)/m).toLocaleString("ko-KR");};
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200);}

/* ===== 계산 (오드볼 ERP 방식) ===== */
const UNITS=["g","kg","ml","L","개"];
const gPerUnit=m=>m.unit==="kg"||m.unit==="L"?1000:m.unit==="개"?num(m.unitGrams):1;      // 재료 1단위 = 몇 g
const pricePerUnit=m=>num(m.packQty)>0?num(m.price)/num(m.packQty):0;                     // 재료 1단위당 가격 (g·개 기준)
const matById=id=>D.materials.find(m=>m.id===id);
const recById=id=>D.recipes.find(r=>r.id===id);
function lineInfo(l){const m=matById(l.mid);if(!m)return null;const q=num(l.qty);
  const baseQ=m.unit==="kg"||m.unit==="L"?q/1000:q;                   // 레시피는 g(ml)·개로 입력, 단가는 포장단위 기준
  return {m,q,grams:m.unit==="개"?q*num(m.unitGrams):q,cost:baseQ*pricePerUnit(m)};}
function recipeCalc(r){const lines=(r.lines||[]).map(lineInfo).filter(Boolean);
  const mat=lines.reduce((a,l)=>a+l.cost,0),grams=lines.reduce((a,l)=>a+l.grams,0),y=Math.max(1,num(r.yield)||1);
  const extra=num(r.labor)+num(r.misc)+num(r.pack)*y,total=mat+extra,unit=total/y,margin=Math.min(95,num(r.margin));
  return {lines,mat,grams,y,extra,total,unit,unitG:grams/y,price:margin>0?unit/(1-margin/100):0,margin};}
const RULES=[[/우유|밀크|크림|치즈|연유|유청|분유|카제인|요거트|버터|마가린|생크림/,"우유",/(땅콩|코코아|카카오|아몬드|캐슈|견과)\s*버터|코코넛\s*(크림|밀크)|(아몬드|오트|귀리|두|쌀)\s*(우유|밀크)|두유/],
 [/밀|박력분|강력분|중력분|글루텐|통밀/,"밀",/메밀|밀크|정밀/],[/메밀/,"메밀"],[/계란|달걀|난백|난황|전란|머랭|에그/,"알류"],[/아몬드/,"아몬드"],[/호두|월넛/,"호두"],
 [/땅콩|피넛/,"땅콩"],[/캐슈/,"캐슈넛"],[/피스타치오/,"피스타치오"],[/잣/,"잣"],[/복숭아/,"복숭아"],[/토마토/,"토마토"],[/대두|두유|콩가루|레시틴|두부|된장|간장/,"대두"]];
function guessAllergy(name){const out=[];RULES.forEach(([re,t,ex])=>{const s=ex?String(name).replace(new RegExp(ex.source,"g"),""):String(name);if(re.test(s)&&!out.includes(t))out.push(t);});return out;}
function labelCalc(r){const c=recipeCalc(r);if(!c.grams)return null;const acc=Array(10).fill(0);const miss=[];const al=new Set();const by={};
  c.lines.forEach(l=>{const n=l.m.nutrition;if(Array.isArray(n)&&n.some(v=>v!==""&&v!=null))for(let i=0;i<10;i++)acc[i]+=num(n[i])*l.grams/100;else if(l.grams>0&&!miss.includes(l.m.name))miss.push(l.m.name);
    const tags=(l.m.allergens||"").trim()?l.m.allergens.split(/[,\s]+/).filter(Boolean):guessAllergy(l.m.name+" "+(l.m.labelName||""));tags.forEach(t=>al.add(t));
    if(!l.m.noLabel){const k=l.m.id;by[k]=by[k]||{m:l.m,g:0};by[k].g+=l.grams;}});
  const per100=acc.map(v=>v*100/c.grams);
  const names=Object.values(by).sort((a,b)=>b.g-a.g).map(x=>{const nm=(x.m.labelName||"").trim()||x.m.name;return nm+((x.m.origin||"").trim()?`[${x.m.origin.trim()}]`:"");});
  return {per100,names:names.join(", "),allergens:[...al],miss,c};}
const DV={fat:54,sodium:2000,carb:324,protein:55,sugar:100,chol:300,sat:15};
const NUT=["열량(kcal)","지방(g)","나트륨(mg)","탄수화물(g)","단백질(g)","당류(g)","콜레스테롤(mg)","트랜스지방(g)","포화지방(g)","식이섬유(g)"];

/* ===== 화면 ===== */
const TABS=[["recipe","레시피 원가계산"],["scale","배합 계산기"],["label","표시라벨·영양정보"],["quote","견적서"],["orders","주문 엑셀"],["materials","재료 관리"],["data","저장·백업"]];
const LEADS={recipe:"재료와 사용량만 넣으면 1개당 원가와 마진 기준 판매가가 바로 나와요.",scale:"레시피를 원하는 생산량에 맞춰 재료량을 자동으로 바꿔 드려요.",label:"재료별 영양정보만 넣어 두면 레시피로 100g당 영양정보·원재료명·알레르기를 계산해 라벨로 인쇄해요.",quote:"품목과 단가를 넣으면 공급가·부가세가 자동 계산된 견적서를 인쇄하거나 PDF로 저장해요.",orders:"스마트스토어 주문 엑셀을 붙여넣기만 하면 오늘 만들 양·포장 목록·롯데택배 접수·발송처리 파일이 자동으로 만들어지는 엑셀이에요.",materials:"자주 쓰는 재료의 구매 단가와 영양정보를 등록해 두세요. 모든 도구가 이 재료를 같이 써요.",data:"모든 데이터는 이 컴퓨터의 브라우저에만 저장돼요. 다른 컴퓨터로 옮기거나 지켜 두려면 백업 파일을 받아 두세요."};
let tab=(location.hash.slice(1)||"recipe");if(!TABS.some(t=>t[0]===tab))tab="recipe";
const sel={recipe:null,scale:null,label:null,quote:null,materials:null};
function nav(){ $("#nav").innerHTML=TABS.map(([k,t])=>`<button data-tab="${k}" ${k===tab?'aria-current="page"':""}>${t}</button>`).join("");}
function go(t){tab=t;history.replaceState(null,"","#"+t);render();scrollTo({top:0});}
const GUIDE={
recipe:[["재료부터 등록","'재료 관리' 탭에서 재료 이름·단위·구매 가격·구매 수량을 넣어요. 예) 버터 4.5kg 72,000원 → 단위 kg, 가격 72000, 수량 4.5. '예시 재료 넣기'로 연습해 볼 수 있어요."],["레시피 만들기","'+ 레시피 추가' → 이름과 '생산 개수'(이 배합으로 몇 개 나오는지)를 넣어요."],["재료 줄 채우기","재료를 고르고 사용량을 g(개 단위 재료는 개수)으로 넣어요. 금액과 비중 막대가 바로 계산돼요. 목록에 없는 재료는 '+ 새 재료 바로 만들기'."],["비용·마진 넣기","인건비·기타 비용은 배치(한 번 만들 때) 기준, 포장비는 1개 기준이에요. 목표 마진율을 넣으면 권장 판매가가 나와요."],["결과 보기","아래 칸에서 1개당 원가·1개 무게·권장 판매가를 확인해요. 권장 판매가 = 1개당 원가 ÷ (1 − 마진율), 부가세 별도."]],
scale:[["레시피 고르기","원가계산에서 만든 레시피를 골라요."],["기준 정하기","'개수 × 1개 무게'(예: 40개 × 45g), '총 반죽량'(예: 5,000g), '배수'(예: 2.5배) 중 편한 걸 골라요."],["필요량 확인","재료별 필요량·비율(%)·재료비가 바로 바뀌어요. 비율은 반죽 전체에서 그 재료가 차지하는 무게 비율이에요."],["작업지시서 인쇄","'작업지시서 인쇄'를 누르면 표만 깔끔하게 인쇄돼요. 굽기 손실이 있으면 개수를 조금 넉넉히 잡으세요."]],
label:[["재료 영양정보 넣기","'재료 관리'에서 재료마다 100g당 영양정보 10칸을 제품 포장지 표대로 옮겨 적어요. 알레르기·원산지·라벨 표기명도 넣을 수 있어요."],["업소 정보 넣기","'저장·백업' 탭에서 업소명·소재지·연락처·식품유형·보관방법·소비기한을 한 번만 넣어요."],["레시피 고르기","라벨 탭에서 레시피를 고르면 100g당 영양정보, 많이 들어간 순서의 원재료명, 알레르기가 자동으로 채워져요."],["내용량·제조일자","내용량은 레시피 1개 무게로 자동 입력되고, 바꿀 수 있어요. 제조일자는 '별도표기일까지'나 날짜를 적어요."],["인쇄","인쇄 매수를 넣고 '라벨 인쇄'. 100×80mm 라벨지 기준이에요. 영양정보가 빠진 재료가 있으면 빨간 글씨로 알려 드려요. 표시 의무 사항은 최종으로 꼭 확인해 주세요."]],

 else if(d.n!=null){const m=cur("materials");m.nutrition=m.nutrition||Array(10).fill("");m.nutrition[+d.n]=val;}

 else if(d.sc){if(d.sc==="rid"){sel.scale=val;sel.scaleOpt=null;}else{sel.scaleOpt[d.sc]=val;}d.sc==="rid"||d.sc==="mode"?render():rerender();return;}
 else if(d.lb){if(d.lb==="rid"){sel.label=val;sel.labelOpt=null;render();return;}sel.labelOpt[d.lb]=val;rerender();return;}
